<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast AI Director</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Podcast AI Director</h1>

<div class="card" id="sourceCard">
<h2>音源</h2>
<div id="drop" class="dropzone">
<input type="file" id="audio" accept="audio/*,.aac,.m4a,.mp3,.wav,.ogg,.flac,.wma">
<p>音源ファイルをドラッグ＆ドロップ、またはクリックして選択</p>
<p class="small">対応形式：MP3 / WAV / M4A / AAC / OGG / FLAC など</p>
</div>
<div id="audioName" class="filename"></div>
<div id="sourceDuration" class="duration"></div>
<audio id="originalPreview" controls hidden></audio>
</div>

<div class="card" id="transcribeCard">
<h2>文字起こし</h2>
<div class="row">
<label>モデル：<select id="model"><option value="tiny">Tiny（速い）</option><option value="base" selected>Base（標準）</option><option value="small">Small（高精度）</option></select></label>
<label>言語：<select id="language"><option value="ja">日本語</option><option value="en">英語</option><option value="auto">自動検出</option></select></label>
</div>
<button id="transcribe" disabled>文字起こし開始</button>
<div id="progressbox" hidden>
<progress id="progress" max="100" value="0"></progress>
<span id="progressNum">0%</span>
<div id="progressText"></div>
<div id="progressDetail" class="small"></div>
</div>
</div>

<div class="card" id="transcriptCard" hidden>
<h2>文字起こし結果</h2>
<div class="speaker-tools">
<button id="autoSpeaker" class="small-btn">話者を自動推定（間隔ベース）</button>
<span class="small">セグメント間が1.5秒以上空くと話者を切り替えます</span>
</div>
<div id="transcriptContainer" class="transcript-container"></div>
<textarea id="transcript" rows="10" placeholder="文字起こし結果がここに表示されます"></textarea>
<div class="btn-group">
<button id="copyPrompt">編集指示プロンプトをコピー</button>
<button id="downloadTranscript">TXTダウンロード</button>
<button id="downloadTranscriptJson">JSONダウンロード</button>
</div>
</div>

<div class="card" id="editCard" hidden>
<h2>編集指示JSON</h2>
<textarea id="instructions" rows="8" placeholder='{"version":1,"operations":[],"notes":[]}'></textarea>
<div class="btn-group">
<input type="file" id="jsonFile" accept=".json">
<button id="validate">検証</button>
<button id="sample">サンプル入力</button>
</div>
<div id="validation" class="validation"></div>
<div id="operationList" class="op-list"></div>
<div id="timeline" class="timeline"></div>
<div id="timelineScale" class="timeline-scale"></div>
</div>

<div class="card" id="renderCard" hidden>
<h2>BGM・出力設定</h2>
<div class="row">
<input type="file" id="bgm" accept="audio/*">
<span id="bgmName">BGM未選択</span>
</div>
<label>出力形式：<select id="format"><option value="mp3">MP3</option><option value="wav">WAV</option></select></label>
<button id="execute" disabled>編集を実行</button>
<div id="editProgressBox" hidden>
<progress id="editProgress" max="100" value="0"></progress>
<span id="editProgressNum">0%</span>
<div id="editProgressText"></div>
</div>
</div>

<div class="card" id="compareCard" hidden>
<h2>完成音源</h2>
<audio id="preview" controls></audio>
<div id="editedDuration"></div>
<a id="save" class="btn" download>ダウンロード</a>
</div>

<div id="output" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
